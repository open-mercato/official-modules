name: CI for Develop&Main

permissions:
  contents: read

on:
  pull_request:
    branches:
      - main
      - develop

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PLATFORM_CHANNEL: ${{ github.base_ref == 'main' && 'latest' || 'develop' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install markitdown CLI
        run: python3 -m pip install --upgrade pip markitdown

      - name: Install dependencies
        run: yarn install --immutable

      - name: Check platform sync
        if: github.base_ref == 'main'
        run: yarn platform:sync --check --channel "$PLATFORM_CHANNEL"

      - name: Build packages
        run: yarn build:packages

      - name: Prepare generated modules
        run: yarn generate

      - name: Rebuild packages with generated files
        run: yarn build:packages

      - name: Check dependency version conflicts
        run: yarn check:dep-versions

      - name: Check i18n sync
        run: yarn i18n:check-sync:packages

      - name: Check i18n usage
        run: yarn i18n:check-usage:packages
        continue-on-error: true

      - name: Checking types
        run: yarn typecheck

      - name: Test
        run: yarn test

  detect-changes:
    name: Detect changed packages
    runs-on: ubuntu-latest
    outputs:
      changed_packages: ${{ steps.detect.outputs.changed_packages }}
      has_changes: ${{ steps.detect.outputs.has_changes }}
    # Skip PRs from forks (no access to secrets)
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed packages
        id: detect
        run: |
          CHANGED=$(git diff --name-only \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.sha }}" \
            | grep '^packages/' | cut -d'/' -f2 | sort -u || true)

          PUBLISHABLE_CHANGED=$(printf '%s\n' "$CHANGED" | while IFS= read -r package_dir; do
            if [ -z "$package_dir" ]; then
              continue
            fi

            manifest_path="packages/$package_dir/package.json"

            if [ -f "$manifest_path" ] && jq -e '.private != true and .publishConfig.access == "public"' "$manifest_path" >/dev/null; then
              printf '%s\n' "$package_dir"
            fi
          done | sort -u)

          if [ -z "$PUBLISHABLE_CHANGED" ]; then
            echo "No public publishable package changes detected — skipping canary publish."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "changed_packages=[]" >> "$GITHUB_OUTPUT"
          else
            echo "Changed public publishable packages:"
            echo "$PUBLISHABLE_CHANGED"
            PACKAGES_JSON=$(printf '%s\n' "$PUBLISHABLE_CHANGED" | jq -R . | jq -sc .)
            echo "changed_packages=$PACKAGES_JSON" >> "$GITHUB_OUTPUT"
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

  publish-canary:
    name: Publish canary — ${{ matrix.package }}
    needs: detect-changes
    if: needs.detect-changes.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: ${{ fromJson(needs.detect-changes.outputs.changed_packages) }}
      fail-fast: false
    outputs:
      # Last matrix job wins, but every matrix leg computes the same deterministic
      # PREVIEW_VERSION_ID from the workflow run attempt and commit SHA.
      canary_version_id: ${{ steps.publish.outputs.canary_version_id }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install monorepo dependencies
        run: yarn install --immutable

      - name: Publish canary package
        id: publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PUBLISH_PACKAGE_FILTER: ${{ matrix.package }}
        run: |
          SHORT_SHA="${GITHUB_SHA:0:7}"
          export PREVIEW_VERSION_ID="${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}.${SHORT_SHA}"

          echo "canary_version_id=${PREVIEW_VERSION_ID}" >> "$GITHUB_OUTPUT"

          bash scripts/publish-canary.sh

  integration-test:
    name: Integration test — ${{ matrix.package }}
    needs: [detect-changes, publish-canary]
    if: needs.detect-changes.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    env:
      PLATFORM_CHANNEL: ${{ github.base_ref == 'main' && 'latest' || 'develop' }}
      CREATE_APP_TAG: ${{ github.base_ref == 'main' && 'latest' || 'develop' }}
    strategy:
      matrix:
        package: ${{ fromJson(needs.detect-changes.outputs.changed_packages) }}
      fail-fast: false
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: mercato
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: mercato_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
  
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Node 24.16+ can hang indefinitely while Playwright 1.58 extracts browsers.
          node-version: 24.15.0
  
      - name: Enable Corepack
        run: corepack enable
  
      - name: Install monorepo dependencies
        run: yarn install --immutable

      - name: Check platform sync
        if: github.base_ref == 'main'
        run: yarn platform:sync --check --channel "$PLATFORM_CHANNEL"

      - name: Build monorepo packages
        run: |
          yarn build:packages
          yarn generate
          yarn build:packages
  
      - name: Resolve canary version
        id: version
        run: |
          VERSION_ID="${{ needs.publish-canary.outputs.canary_version_id }}"
          # Read the base version from the package manifest
          BASE_VERSION=$(node -p "require('./packages/${{ matrix.package }}/package.json').version")
          PKG_NAME=$(node -p "require('./packages/${{ matrix.package }}/package.json').name")
          CANARY_VERSION="${BASE_VERSION}-canary.${VERSION_ID}"
          echo "pkg_name=${PKG_NAME}" >> "$GITHUB_OUTPUT"
          echo "canary_version=${CANARY_VERSION}" >> "$GITHUB_OUTPUT"
  
      - name: Wait for npm registry propagation
        run: |
          PKG="${{ steps.version.outputs.pkg_name }}"
          VERSION="${{ steps.version.outputs.canary_version }}"
          echo "Waiting for ${PKG}@${VERSION} on npm..."
          for i in $(seq 1 30); do
            if npm view "${PKG}@${VERSION}" version --registry https://registry.npmjs.org 2>/dev/null; then
              echo "Available after attempt ${i}"
              exit 0
            fi
            echo "Attempt ${i}/30: waiting 10s..."
            sleep 10
          done
          echo "${PKG}@${VERSION} not available after 5 minutes"
          exit 1
  
      - name: Scaffold standalone app
        run: npx --yes "create-mercato-app@${CREATE_APP_TAG}" /tmp/standalone-app --preset classic --skip-agentic-setup --no-init-git --registry https://registry.npmjs.org
  
      - name: Configure standalone app environment
        working-directory: /tmp/standalone-app
        run: |
          cp .env.example .env
          cat >> .env << 'EOF'
          DATABASE_URL=postgres://mercato:secret@localhost:5432/mercato_test
          TENANT_DATA_ENCRYPTION_FALLBACK_KEY=ci-standalone-test-fallback-key
          NODE_ENV=test
          OM_TEST_MODE=1
          OM_TEST_AUTH_RATE_LIMIT_MODE=opt-in
          OM_DISABLE_EMAIL_DELIVERY=1
          ENABLE_CRUD_API_CACHE=true
          NEXT_PUBLIC_OM_EXAMPLE_INJECTION_WIDGETS_ENABLED=true
          AUTO_SPAWN_WORKERS=false
          AUTO_SPAWN_SCHEDULER=false
          CACHE_STRATEGY=memory
          EOF

      - name: Install standalone app dependencies
        working-directory: /tmp/standalone-app
        env:
          YARN_ENABLE_IMMUTABLE_INSTALLS: "false"
        run: yarn install

      - name: Install canary module
        working-directory: /tmp/standalone-app
        env:
          YARN_ENABLE_IMMUTABLE_INSTALLS: "false"
        run: |
          yarn mercato module add \
            "${{ steps.version.outputs.pkg_name }}@${{ steps.version.outputs.canary_version }}"

      - name: Generate standalone app modules
        working-directory: /tmp/standalone-app
        run: yarn generate

      - name: Initialize standalone app database
        working-directory: /tmp/standalone-app
        run: yarn initialize

      - name: Build standalone app
        working-directory: /tmp/standalone-app
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NODE_OPTIONS: "--max-old-space-size=6144"
        run: yarn exec next build

      - name: Start standalone app
        working-directory: /tmp/standalone-app
        run: |
          PORT=3001 yarn start &
          echo "Waiting for standalone app to be ready..."
          for i in $(seq 1 90); do
            if curl -sf http://localhost:3001/login > /dev/null 2>&1; then
              echo "App ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "App failed to start within 90s"
          exit 1

        # --- Run integration tests ---
      - name: Install Playwright
        timeout-minutes: 20
        run: yarn exec playwright install --with-deps --only-shell chromium

      - name: Run integration tests
        env:
          BASE_URL: http://localhost:3001
        run: |
          yarn exec playwright test \
            --config .ai/qa/tests/playwright.config.ts \
            "packages/${{ matrix.package }}" \
            --pass-with-no-tests
